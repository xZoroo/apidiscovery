<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>API Discovery</title>
  </head>
  <body class="bg-page p-3 text-ink">
    <div class="mb-3 flex items-center justify-between">
      <h1 class="text-sm font-semibold">API Discovery</h1>
      <button
        id="open-dashboard"
        class="rounded-md border border-line px-2 py-1 text-xs font-medium hover:bg-surface"
      >
        Open full dashboard
      </button>
    </div>
    <div class="overflow-hidden rounded-lg border border-line bg-surface">
      <div class="overflow-x-auto">
        <table class="w-full table-fixed border-collapse text-xs">
          <colgroup>
            <col class="w-[9%]" />
            <col class="w-[17%]" />
            <col class="w-[29%]" />
            <col class="w-[27%]" />
            <col class="w-[8%]" />
            <col class="w-[10%]" />
          </colgroup>
          <thead>
            <tr
              class="border-b border-line bg-page text-left font-semibold uppercase tracking-wide text-ink-muted"
            >
              <th class="px-2 py-1.5">Method</th>
              <th class="px-2 py-1.5">Host</th>
              <th class="px-2 py-1.5">Path</th>
              <th class="px-2 py-1.5">Flags</th>
              <th class="px-2 py-1.5">Seen</th>
              <th class="px-2 py-1.5">Source</th>
            </tr>
          </thead>
          <tbody id="endpoint-rows"></tbody>
        </table>
      </div>
    </div>
    <div id="detail" class="mt-3"></div>

    <script type="module" src="./panel.ts"></script>
  </body>
</html>
