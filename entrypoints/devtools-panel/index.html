<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>API Discovery</title>
  </head>
  <body class="bg-slate-50 p-3 text-slate-900 dark:bg-slate-950 dark:text-slate-100">
    <div class="mb-3 flex items-center justify-between">
      <h1 class="text-sm font-semibold">API Discovery</h1>
      <button
        id="open-dashboard"
        class="rounded-md border border-slate-300 px-2 py-1 text-xs font-medium hover:bg-slate-100 dark:border-slate-700 dark:hover:bg-slate-800"
      >
        Open full dashboard
      </button>
    </div>
    <div
      class="overflow-hidden rounded-lg border border-slate-200 bg-white dark:border-slate-800 dark:bg-slate-900"
    >
      <div class="overflow-x-auto">
        <table class="w-full table-fixed border-collapse text-xs">
          <colgroup>
            <col class="w-[9%]" />
            <col class="w-[17%]" />
            <col class="w-[29%]" />
            <col class="w-[27%]" />
            <col class="w-[8%]" />
            <col class="w-[10%]" />
          </colgroup>
          <thead>
            <tr
              class="border-b border-slate-200 bg-slate-50 text-left font-semibold uppercase tracking-wide text-slate-500 dark:border-slate-800 dark:bg-slate-800/50 dark:text-slate-400"
            >
              <th class="px-2 py-1.5">Method</th>
              <th class="px-2 py-1.5">Host</th>
              <th class="px-2 py-1.5">Path</th>
              <th class="px-2 py-1.5">Flags</th>
              <th class="px-2 py-1.5">Seen</th>
              <th class="px-2 py-1.5">Source</th>
            </tr>
          </thead>
          <tbody id="endpoint-rows"></tbody>
        </table>
      </div>
    </div>
    <div id="detail" class="mt-3"></div>

    <script type="module" src="./panel.ts"></script>
  </body>
</html>
